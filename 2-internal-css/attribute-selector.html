<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input[type="text"]{
            width:250px;
            color:red;
            padding:4px;
        }

        input[type="email"], input[type="number"]{
            width:300px;
            height:28px;
            color:blue;
            padding:4px;
        }
    </style>
</head>
<body>
    <h1> How to Apply CSS Using Attribute </h1>

    <p> Full Name : <input type="text"/> </p>
    <p> Mobile No : <input type="number"/> </p>
    <p> e-Mail Id : <input type="email"/> </p>


</body>
</html>
