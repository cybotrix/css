<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            margin:2%;
            padding:70px 0px 70px;
            float:left;
            text-align:center;
            color:yellow;
            font-size:60px;
            width:21%;
        }

        #bg1{ background:darkcyan; }
        #bg2{ background-color:darkcyan; }
        #bg3{ background-color:rgb(100, 18, 87); }
        #bg4{ background-color:rgba(100, 18, 87, 0.6); }
        #bg5{ background-image:linear-gradient(darkcyan, red) }
        #bg6{ background-image:linear-gradient(to left, darkcyan, red) }

        #bg7{ background-image:linear-gradient(to right, darkcyan, red) }
        #bg8{ background-image:linear-gradient(to top, darkcyan, red) }
        #bg9{ background-image:url('1.jpg'); background-size:100% 100%; }

    </style>
</head>
<body>

    <div id="bg1"> Bangalore </div>
    <div id="bg2"> Bangalore </div>
    <div id="bg3"> Bangalore </div>
    <div id="bg4"> Bangalore </div>
    <div id="bg5"> Bangalore </div>
    <div id="bg6"> Bangalore </div>
    <div id="bg7"> Bangalore </div>
    <div id="bg8"> Bangalore </div>
    <div id="bg9"> Bangalore </div>

</body>
</html>
