<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{ margin:0px; }
        header{
            padding:10px 10% 10px;
            background:darkred;
            color:white;
            display:grid;
            grid-template-columns:80% 20%;
            font-size:18px;
        }

        ul{
            background-color:rgb(63, 58, 145);
            margin:0px;
            padding:0px 10% 0px;
            list-style-type:none;
            display:flex;
            flex-wrap:wrap;
            top:0px;
            position:sticky;
        }

        li{
            color:white;
            font-size: 22px;
            padding:20px 45px 20px;
        }

        li:hover{
            background-color:red;
            cursor:pointer;
        }

        section{
            padding:40px 10% 40px;
            display:flex;
            flex-wrap: wrap;
            min-height:550px;
        }

        section div{
            color:rgb(206, 93, 23);
            font-size:38px;
            margin:40px 50px 40px;
        }


        footer{
            border-top:20px dashed orange;
            background-color: darkcyan;
            color:white;
            text-align:center;
            font-size:19px;
            padding:20px;
            min-height:140px;
        }
    </style>
</head>
<body>
    <header>
        <div> 88888888888999 </div>
        <div> contact@urwebsite.com </div>
    </header>
    <ul>
        <li> Home </li>
        <li> About Us </li>
        <li> Contact Us </li>
        <li> Login </li>
        <li> Create Account </li>
        <li> Our Services </li>
    </ul>

    <section>
         <div> Website Development </div>
         <div> Logo Design </div>
         <div> App Development </div>
         <div> Digital Marketing </div>
         <div> Api Development </div>
         <div> CRM Development </div>
         <div> Portal Development </div>
    </section>

    <footer>
        <p> Help center 9999999999 </p>
    </footer>
</body>
</html>
