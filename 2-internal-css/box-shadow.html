<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        div{
            vertical-align:top;
        }
        
        #block1{
            height:300px;
            width:300px;
            margin:40px;
            display:inline-block;
            box-shadow:0px 0px 5px red;
        }

        #block2{
            height:300px;
            width:300px;
            margin:70px;
            display:inline-block;
            box-shadow:50px 20px 10px black;
            background:skyblue;
        }

        #block3{
            height:300px;
            width:300px;
            margin:70px;
            display:inline-block;
            box-shadow:50px 50px 10px black;
            background:skyblue;
        }

        #block4{
            height:300px;
            width:300px;
            margin:70px;
            display:inline-block;
            box-shadow:-50px -50px 10px black;
            background:skyblue;
        }
    </style>
</head>
<body>
    <h1> CSS Box Shadow Example </h1>
    <div id="block1"> fgh fgh fgh fgh fgh </div>
    <div id="block2"> </div>
    <div id="block3"> </div>
    <div id="block4">  </div>
</body>
</html>
